      body: "## What's Changed\r\n* build(deps): bump actions/checkout from 4 to 5
        by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2128\r\n*
        Update recommended Helm versions in init.go and run.sh by @yxxhero in https://github.com/helmfile/helmfile/pull/2129\r\n*
        Add comprehensive .github/copilot-instructions.md for coding agents by @Copilot
        in https://github.com/helmfile/helmfile/pull/2131\r\n* refactor(state): extract
        getMissingFileHandler method for clarity by @yxxhero in https://github.com/helmfile/helmfile/pull/2133\r\n*
        Fix parseHelmVersion to handle helm versions without 'v' prefix by @Copilot
        in https://github.com/helmfile/helmfile/pull/2132\r\n* build(deps): bump k8s.io/apimachinery
        from 0.33.3 to 0.33.4 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2136\r\n*
        build(deps): bump github.com/helmfile/chartify from 0.24.6 to 0.24.7 by @dependabot[bot]
        in https://github.com/helmfile/helmfile/pull/2135\r\n\r\n## New Contributors\r\n*
        @Copilot made their first contribution in https://github.com/helmfile/helmfile/pull/2131\r\n\r\n**Full
        Changelog**: https://github.com/helmfile/helmfile/compare/v1.1.4...v1.1.5"
