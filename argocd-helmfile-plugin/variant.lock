      body: "## What's Changed\r\n* build(deps): bump github.com/stretchr/testify
        from 1.11.1 to 1.12.0 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2749\r\n*
        build(deps): bump github.com/aws/aws-sdk-go-v2/config from 1.32.36 to 1.32.37
        by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2750\r\n*
        build(deps): bump github.com/aws/aws-sdk-go-v2/service/s3 from 1.107.1 to
        1.107.2 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2751\r\n*
        build(deps): bump github.com/stretchr/testify from 1.12.0 to 1.12.1 by @dependabot[bot]
        in https://github.com/helmfile/helmfile/pull/2752\r\n* docs: fix broken star
        history chart by @Dessalines39394 in https://github.com/helmfile/helmfile/pull/2742\r\n*
        build(deps): bump github.com/mattn/go-runewidth from 0.0.27 to 0.0.28 by @dependabot[bot]
        in https://github.com/helmfile/helmfile/pull/2753\r\n* build(deps): bump github.com/aws/aws-sdk-go-v2/config
        from 1.32.37 to 1.32.38 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2755\r\n*
        build(deps): bump github.com/aws/aws-sdk-go-v2/service/s3 from 1.107.2 to
        1.107.3 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2756\r\n*
        build(deps): bump helm-diff to v3.15.12 by @yxxhero in https://github.com/helmfile/helmfile/pull/2759\r\n*
        build(deps): bump github.com/aws/aws-sdk-go-v2/config from 1.32.38 to 1.33.1
        by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2762\r\n*
        build(deps): bump github.com/gofrs/flock from 0.13.0 to 0.13.1 by @dependabot[bot]
        in https://github.com/helmfile/helmfile/pull/2761\r\n* build(deps): bump github.com/aws/aws-sdk-go-v2/service/s3
        from 1.107.3 to 1.109.1 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2760\r\n*
        build(deps): bump google.golang.org/grpc from 1.82.1 to 1.83.1 by @dependabot[bot]
        in https://github.com/helmfile/helmfile/pull/2763\r\n* feat: allow helmfile
        to continue on failed releases by @ceriath in https://github.com/helmfile/helmfile/pull/2616\r\n*
        build(deps): bump github.com/aws/aws-sdk-go-v2/service/s3 from 1.109.1 to
        1.110.0 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2764\r\n*
        build(deps): bump github.com/aws/aws-sdk-go-v2/config from 1.33.1 to 1.33.2
        by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2765\r\n*
        fix: resolve OCI version constraints before deriving the shared chart cache
        path by @samifruit514 in https://github.com/helmfile/helmfile/pull/2768\r\n*
        feat: opt-in OpenTelemetry tracing and metrics (experimental) by @yxxhero
        in https://github.com/helmfile/helmfile/pull/2769\r\n* build(deps): bump go.opentelemetry.io/otel
        from 1.44.0 to 1.46.0 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2778\r\n*
        build(deps): bump github.com/mattn/go-runewidth from 0.0.28 to 0.0.29 by @dependabot[bot]
        in https://github.com/helmfile/helmfile/pull/2776\r\n* build(deps): bump go.opentelemetry.io/otel/sdk/metric
        from 1.44.0 to 1.46.0 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2777\r\n*
        build(deps): bump go.opentelemetry.io/proto/otlp from 1.10.0 to 1.11.0 by
        @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2774\r\n* build(deps):
        bump go.opentelemetry.io/otel/sdk from 1.44.0 to 1.46.0 by @dependabot[bot]
        in https://github.com/helmfile/helmfile/pull/2775\r\n* build(deps): bump gitpython
        from 3.1.58 to 3.1.59 in /docs by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2785\r\n*
        build(deps): bump google.golang.org/grpc from 1.83.1 to 1.83.2 by @dependabot[bot]
        in https://github.com/helmfile/helmfile/pull/2784\r\n* build(deps): bump google.golang.org/protobuf
        from 1.36.12-0.20260120151049-f2248ac996af to 1.36.12 by @dependabot[bot]
        in https://github.com/helmfile/helmfile/pull/2783\r\n* build(deps): bump golang.org/x/sync
        from 0.22.0 to 0.23.0 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2782\r\n*
        build(deps): bump github.com/aws/aws-sdk-go-v2/config from 1.33.2 to 1.33.3
        by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2781\r\n*
        build(deps): bump go.opentelemetry.io/contrib/exporters/autoexport from 0.67.0
        to 0.71.0 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2780\r\n*
        build(deps): bump github.com/aws/aws-sdk-go-v2/service/s3 from 1.110.0 to
        1.111.0 by @dependabot[bot] in https://github.com/helmfile/helmfile/pull/2779\r\n*
        fix(list): avoid deadlock in `helmfile list` with more than 100 states by
        @max06 in https://github.com/helmfile/helmfile/pull/2773\r\n* chore: bump
        Helm to v3.22.0 and v4.3.0 by @yxxhero in https://github.com/helmfile/helmfile/pull/2786\r\n*
        build(deps): bump helm-diff to v3.15.13 by @yxxhero in https://github.com/helmfile/helmfile/pull/2788\r\n*
        feat(remote): support wildcards in remote values/secrets file selectors by
        @hoppla20 in https://github.com/helmfile/helmfile/pull/2787\r\n* build(deps):
        bump helmfile/vals from v0.46.0 to v0.46.1 by @yxxhero in https://github.com/helmfile/helmfile/pull/2789\r\n\r\n##
        New Contributors\r\n* @Dessalines39394 made their first contribution in https://github.com/helmfile/helmfile/pull/2742\r\n*
        @samifruit514 made their first contribution in https://github.com/helmfile/helmfile/pull/2768\r\n*
        @max06 made their first contribution in https://github.com/helmfile/helmfile/pull/2773\r\n*
        @hoppla20 made their first contribution in https://github.com/helmfile/helmfile/pull/2787\r\n\r\n**Full
        Changelog**: https://github.com/helmfile/helmfile/compare/v1.7.4...v1.8.0"
