      body: "Helm v3.22.0 is a feature release. Users are encouraged to upgrade for
        the best experience.\r\n\r\nThe community keeps growing, and we'd love to
        see you there!\r\n\r\n- Join the discussion in [Kubernetes Slack](https://kubernetes.slack.com):\r\n
        \ -  for questions and just to hang out\r\n  -  for discussing PRs, code,
        and bugs\r\n- Hang out at the Public Developer Call: Thursday, 9:30 Pacific
        via [Zoom](https://zoom-lfx.platform.linuxfoundation.org/meeting/91295593969?password=17825db5-c698-44cc-9f00-ef1f61f5d3fb)\r\n-
        Test, debug, and contribute charts: [ArtifactHub/packages](https://artifacthub.io/packages/search?kind=0)\r\n\r\n##
        Notable Changes\r\n\r\n- primarily dependency updates and k8s-io group to
        0.37.0\r\n\r\n## Installation and Upgrading\r\n\r\nDownload Helm v3.22.0.
        The common platform binaries are here:\r\n\r\n- [MacOS amd64](https://get.helm.sh/helm-v3.22.0-darwin-amd64.tar.gz)
        ([checksum](https://get.helm.sh/helm-v3.22.0-darwin-amd64.tar.gz.sha256sum)
