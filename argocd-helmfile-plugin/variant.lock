          body: "Helm v3.22.0 is a feature release. Users are encouraged to upgrade
            for the best experience.\r\n\r\nThe community keeps growing, and we'd
            love to see you there!\r\n\r\n- Join the discussion in [Kubernetes Slack](https://kubernetes.slack.com):\r\n
            \ -  for questions and just to hang out\r\n  -  for discussing PRs, code,
            and bugs\r\n- Hang out at the Public Developer Call: Thursday, 9:30 Pacific
            via [Zoom](https://zoom-lfx.platform.linuxfoundation.org/meeting/91295593969?password=17825db5-c698-44cc-9f00-ef1f61f5d3fb)\r\n-
            Test, debug, and contribute charts: [ArtifactHub/packages](https://artifacthub.io/packages/search?kind=0)\r\n\r\n##
            Notable Changes\r\n\r\n- primarily dependency updates and k8s-io group
            to 0.37.0\r\n\r\n## Installation and Upgrading\r\n\r\nDownload Helm v3.22.0.
            The common platform binaries are here:\r\n\r\n- [MacOS amd64](https://get.helm.sh/helm-v3.22.0-darwin-amd64.tar.gz)
            ([checksum](https://get.helm.sh/helm-v3.22.0-darwin-amd64.tar.gz.sha256sum)
            / bd1d09f316558dda23698527859600936fed1371021ce0f2272d66b2fdcfa69c)\r\n-
            [MacOS arm64](https://get.helm.sh/helm-v3.22.0-darwin-arm64.tar.gz) ([checksum](https://get.helm.sh/helm-v3.22.0-darwin-arm64.tar.gz.sha256sum)
            / 4c9982a6cdeb458b60258df66b55398ca5b19293f6877faffe2909ad6f23dfe0)\r\n-
            [Linux amd64](https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz) ([checksum](https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz.sha256sum)
            / 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb)\r\n-
            [Linux arm](https://get.helm.sh/helm-v3.22.0-linux-arm.tar.gz) ([checksum](https://get.helm.sh/helm-v3.22.0-linux-arm.tar.gz.sha256sum)
            / 695793765e2246824a7c859562886f79b1cc89d99420c89f940590440f7129ee)\r\n-
            [Linux arm64](https://get.helm.sh/helm-v3.22.0-linux-arm64.tar.gz) ([checksum](https://get.helm.sh/helm-v3.22.0-linux-arm64.tar.gz.sha256sum)
            / f14e804dfee240f55525b667488fe9adca349e63e00c9af634c0beb1421ac310)\r\n-
            [Linux i386](https://get.helm.sh/helm-v3.22.0-linux-386.tar.gz) ([checksum](https://get.helm.sh/helm-v3.22.0-linux-386.tar.gz.sha256sum)
            / b96b7a125cc7d38aa952a78b16e96d05426cd9791dd013be51ebab1c203d6729)\r\n-
            [Linux loong64](https://get.helm.sh/helm-v3.22.0-linux-loong64.tar.gz)
