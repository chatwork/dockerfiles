command:
  /usr/local/bin/sops -v:
    exit-status: 0
  /usr/local/bin/argocd version:
    exit-status: 1
    stdout:
    - "3.6.1"
  /usr/local/bin/kubectl version --client:
    exit-status: 0
  /usr/local/bin/helm plugin list:
    exit-status: 0
    stdout:
      - /^diff/
      - /^helm-git/
      - /^secrets/
  /usr/local/bin/helm version:
    exit-status: 0
    stdout:
      - "4.3.1"
  /usr/local/bin/helmfile -v:
    exit-status: 0
    stdout:
      - "1.8.3"
  # CVE-2026-109518: the image must ship the fixed APT
  dpkg --compare-versions "$(dpkg-query -W -f='${Version}' apt)" ge 3.2.1ubuntu0.1:
    exit-status: 0
