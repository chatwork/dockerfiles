file:
 /usr/bin/conftest:
    exists: true
    mode: "0755"
command:
  /usr/bin/conftest --version:
    exit-status: 0
    stdout:
      - 0.71.1
  # CVE-2026-109518: the image must ship the fixed APT
  dpkg --compare-versions "$(dpkg-query -W -f='${Version}' apt)" ge 2.4.15ubuntu0.1:
    exit-status: 0
